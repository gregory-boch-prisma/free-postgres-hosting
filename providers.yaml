# Setup guide: https://freebase.cloud/how-to-connect-claude-to-postgresql  |  Free instance: https://freebase.cloud/free-postgresql-cloud-instance
# Data file for the comparison table in README.md.
#
# Edit THIS file, not the table in the README. Then run:
#
#     python3 compare.py --write
#
# Field reference
#   name          Display name of the provider.
#   url           Public homepage or pricing page.
#   status        live | discontinued | changed
#   free_tier     Short qualitative phrase. No invented numbers.
#   expiry        What ends the free instance: "none", "expires after N days",
#                 "pauses after N of inactivity", "trial credit".
#   card          yes | no | unclear   (credit card needed to reach the free tier)
#   access        How you talk to it: native wire protocol, HTTP API, both.
#   best_at       What this provider genuinely does better than the others.
#                 Required. A row without this is not a fair comparison.
#   limits        Figures we actually read on the source page this cycle.
#                 Leave empty rather than guessing.
#   source        URL the limits came from.
#   verified      ISO date the source URL was last read by a human.

providers:
  - name: freebase.cloud
    url: https://freebase.cloud
    status: live
    free_tier: free-forever
    expiry: none
    card: "no"
    access: native wire protocol (PostgreSQL 16.2) + HTTP + MCP
    best_at: >-
      Fifteen engines under one login, and an MCP endpoint so an AI assistant can
      query the same instance your driver is connected to.
    limits: >-
      Positioned for development, prototyping and small production workloads.
      No published storage or connection figures.
    source: https://freebase.cloud
    verified: 2026-08-18

  - name: Neon
    url: https://neon.com/pricing
    status: live
    free_tier: named Free plan, described as permanent rather than a trial
    expiry: compute suspends when a monthly allowance is exhausted
    card: "no"
    access: native wire protocol
    best_at: >-
      Copy-on-write branching. A branch of a 5 GB database costs almost nothing
      and appears in seconds, which makes per-pull-request databases practical.
    limits: >-
      0.5 GB storage per project, 100 CU-hours per project, 5 GB egress,
      10 branches per project, 6-hour history window.
    source: https://neon.com/pricing
    verified: 2026-08-18

  - name: Supabase
    url: https://supabase.com/pricing
    status: live
    free_tier: named Free plan
    expiry: project paused after 1 week of inactivity
    card: "no"
    access: native wire protocol + PostgREST
    best_at: >-
      Everything bolted around the database. Auth with row-level-security
      integration, object storage, realtime subscriptions and edge functions are
      all in the same free plan.
    limits: >-
      500 MB database, 1 GB file storage, 5 GB egress, 50,000 monthly active
      auth users, 2M realtime messages, 500k edge function invocations,
      2 active projects per organisation.
    source: https://supabase.com/pricing
    verified: 2026-08-18

  - name: Aiven
    url: https://aiven.io/pricing
    status: live
    free_tier: free plan on selected services
    expiry: none stated; Aiven reserves the right to reclaim long-unused services
    card: unclear
    access: native wire protocol
    best_at: >-
      You get a dedicated VM rather than a slice of a shared cluster, and the
      same free plan shape covers MySQL, Valkey, OpenSearch and Kafka.
    limits: >-
      1 dedicated VM, 1 CPU, 1 GB RAM, 1 GB storage. No region selection,
      no connection pooling, no service integrations on the free plan.
    source: https://aiven.io/pricing
    verified: 2026-08-18

  - name: Prisma Postgres
    url: https://www.prisma.io/pricing
    status: live
    free_tier: free plan
    expiry: no time limit; hard cap on the free plan
    card: "no"
    access: native wire protocol (PostgreSQL 17)
    best_at: >-
      App hosting on the same free plan: Prisma Compute runs a TypeScript app
      next to the database. Any Postgres client connects; pooling is built in.
    limits: >-
      1.01 GB storage, 200,000 operations per month, up to 50 databases. Hard
      cap and no backups on the free plan. Prisma Compute on the same plan,
      TypeScript services only: 1M requests, 360 GB-hours of memory, 4 active
      vCPU-hours and 10 GB of outbound bandwidth per month.
    source: https://www.prisma.io/pricing
    verified: 2026-10-07

  - name: CockroachDB Cloud (Basic)
    url: https://www.cockroachlabs.com/pricing/
    status: live
    free_tier: monthly free allowance on the Basic tier
    expiry: allowance resets monthly; compute scales to zero
    card: unclear
    access: PostgreSQL wire protocol
    best_at: >-
      Horizontal distribution. Multi-region placement and survive-a-node-loss
      semantics are part of the product rather than an add-on.
    limits: 50 million RUs and 10 GiB storage free per month.
    source: https://www.cockroachlabs.com/pricing/
    verified: 2026-08-18

  - name: Render
    url: https://render.com/docs/free
    status: live
    free_tier: free Postgres instance
    expiry: expires 30 days after creation, then a 14-day grace period
    card: "no"
    access: native wire protocol
    best_at: >-
      Sitting next to the web service that uses it. If Render already runs your
      app, the database is one more resource in the same dashboard.
    limits: >-
      1 GB storage; one free Postgres per workspace; deleted permanently after
      the 14-day grace period unless upgraded.
    source: https://render.com/docs/free
    verified: 2026-08-18

  - name: Railway
    url: https://railway.com/pricing
    status: live
    free_tier: trial credit, not an ongoing free tier
    expiry: 30-day trial credit, then a paid minimum
    card: required to continue past the trial
    access: whatever the container image exposes
    best_at: >-
      Deploying arbitrary open-source database images. If you want Postgres 17
      with a specific extension compiled in, Railway will run that container.
    limits: $5 of trial credits over 30 days, then a $1/month minimum.
    source: https://railway.com/pricing
    verified: 2026-08-18

# Providers that used to appear on lists like this one and no longer belong in
# the table above. Kept deliberately: most people arrive here because one of
# these went away.
former:
  - name: ElephantSQL
    what_changed: >-
      Wound down entirely. End of life was 27 January 2025; there is no paid
      tier to fall back to.
    source: https://news.ycombinator.com/item?id=39526483
    verified: 2026-08-18

  - name: Heroku Postgres
    what_changed: >-
      Free product plans were removed on 28 November 2022. Hobby-dev and dev
      Postgres plans went with them; the entry point is now the paid Mini plan.
    source: https://help.heroku.com/RSBRUH58/removal-of-heroku-free-product-plans-faq
    verified: 2026-08-18

  - name: Xata
    what_changed: >-
      No free tier on the managed cloud service. The free option is now
      self-hosting the open-source platform, which still gives you the
      copy-on-write branching and PII anonymisation Xata is known for.
    source: https://xata.io/pricing
    verified: 2026-08-18

  - name: Vercel Postgres
    what_changed: >-
      Folded into the Vercel Marketplace. Postgres is provisioned through a
      partner rather than as a first-party Vercel product.
    source: https://vercel.com/blog/introducing-the-vercel-marketplace
    verified: 2026-08-18
